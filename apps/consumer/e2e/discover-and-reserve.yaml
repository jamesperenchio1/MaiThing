appId: com.maithing.app
---
# Discover, reserve, and pay for a Surprise Bag (test mode).
# Requires a seeded dev project with at least one active Surprise Bag listing.

- launchApp:
    appId: com.maithing.app

- tapOn: ".*Allow.*"
- tapOn: "Sign in"
- tapOn: "Email"
- inputText: ${MAESTRO_BUYER_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_BUYER_PASSWORD}
- tapOn: "Sign in"
- assertVisible: "Discover"
- tapOn: "List"
- tapOn: ".* Surprise Bag.*"
- tapOn: "Reserve"
- tapOn: "Pay"
- assertVisible: "Pickup code"
- takeScreenshot: discover-and-reserve-success
