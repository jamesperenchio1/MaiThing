appId: com.maithing.app
---
# Buyer leaves a dual rating after a successful pickup.

- launchApp:
    appId: com.maithing.app

- tapOn: "Sign in"
- tapOn: "Email"
- inputText: ${MAESTRO_BUYER_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_BUYER_PASSWORD}
- tapOn: "Sign in"
- tapOn: "Orders"
- tapOn: ".*Collected.*"
- tapOn: "Rate"
- tapOn: "Value rating"
- tapOn: "4"
- tapOn: "Quality rating"
- tapOn: "5"
- tapOn: "Submit"
- assertVisible: "Thank you"
- takeScreenshot: buyer-review-success
