appId: com.jamyangperenchio.maithing
---
# Open a merchant detail page and verify information
- runFlow: customer-welcome-flow.yaml

# Welcome flow scrolls down — swipe back to top
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

# Make sure the first featured merchant card is visible
- assertVisible:
    id: "first-featured-merchant"

# Tap the first featured merchant card
- tapOn:
    id: "first-featured-merchant"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "merchant-detail-screen"
    timeout: 10000

- assertVisible:
    id: "merchant-about-section"
- assertVisible:
    id: "merchant-pickup-section"
- assertVisible:
    text: "Available Listings"

# Go back to home via swipe or back button
- swipe:
    direction: RIGHT
    duration: 300
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "customer-home-screen"
    timeout: 10000
- assertVisible:
    id: "home-hero-title"
