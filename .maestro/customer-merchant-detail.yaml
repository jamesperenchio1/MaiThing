appId: com.jamyangperenchio.maithing
---
# Open a merchant detail page and verify information
- runFlow: customer-welcome-flow.yaml

# Welcome flow scrolls down — swipe back to top
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

# Make sure the first featured merchant card is visible
- assertVisible:
    id: "first-featured-merchant"

# Tap the first featured merchant card
- tapOn:
    id: "first-featured-merchant"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "merchant-detail-screen"
    timeout: 10000

- assertVisible:
    id: "merchant-detail-header"
- assertVisible:
    id: "merchant-map-section"

# Scroll down to reveal About, Pickup, and Available Listings sections
- scrollUntilVisible:
    element:
      id: "merchant-about-section"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "merchant-about-section"
- assertVisible:
    id: "merchant-pickup-section"
- scrollUntilVisible:
    element:
      text: "Available Listings"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Available Listings"

# Go back to home via header back button
- tapOn:
    id: "header-back-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "customer-home-screen"
    timeout: 10000
- assertVisible:
    id: "home-hero-title"
