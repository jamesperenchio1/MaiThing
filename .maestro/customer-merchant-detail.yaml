appId: com.jamyangperenchio.maithing
---
# Open a merchant detail page via deep link and verify information
- runFlow: customer-welcome-flow.yaml

# Deep-link directly to a known merchant in the seed data
- openLink: "maithing:///(customer)/merchant/merchant-1"
- waitForAnimationToEnd
# Dismiss the "Open in maithing?" system dialog if it appears
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "merchant-detail-screen"
    timeout: 10000

- assertVisible:
    id: "merchant-detail-header"
- assertVisible:
    id: "merchant-map-section"

# Scroll down to reveal About, Pickup, and Available Listings sections
- scrollUntilVisible:
    element:
      id: "merchant-about-section"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "merchant-about-section"
- assertVisible:
    id: "merchant-pickup-section"
- scrollUntilVisible:
    element:
      text: "Available Listings"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Available Listings"

# Go back to home via header back button
- tapOn:
    id: "header-back-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "customer-home-screen"
    timeout: 10000
