appId: com.jamyangperenchio.maithing
---
# Merchant create listing flow
- runFlow: merchant-switch-flow.yaml

# Already on merchant dashboard after switch; start create listing
- tapOn:
    id: "create-listing-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "create-listing-screen"
    timeout: 10000

- assertVisible:
    id: "create-listing-header"
- assertVisible:
    id: "mystery-box-option"
- assertVisible:
    id: "fixed-item-option"

# Choose Mystery Box
- tapOn:
    id: "mystery-box-option"
- waitForAnimationToEnd

- assertVisible:
    text: "Box Size"
- assertVisible:
    text: "Photos"
- assertVisible:
    text: "Title"
- assertVisible:
    text: "Description"

# Select box size (default is medium, but explicitly select for stability)
- tapOn:
    id: "box-size-medium"

# Fill listing title
- tapOn:
    id: "listing-title-input"
- inputText: "Maestro Test Mystery Box"

# Dismiss keyboard before focusing description so inputText targets the right field
- tapOn:
    text: "return"

# Fill description
- tapOn:
    id: "listing-description-input"
- inputText: "A delicious test mystery box created by Maestro end-to-end testing."

# Dismiss the keyboard so subsequent fields are reachable
- hideKeyboard

# Scroll to and verify the new date/time pickers
- scrollUntilVisible:
    element:
      id: "start-time-input"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "start-time-input"
- assertVisible:
    id: "end-time-input"

# Add a custom dietary tag
- scrollUntilVisible:
    element:
      id: "custom-tag-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "custom-tag-input"
- inputText: "Maestro Tag"
- tapOn:
    id: "add-custom-tag-button"

# Add a custom allergen
- scrollUntilVisible:
    element:
      id: "custom-allergen-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "custom-allergen-input"
- inputText: "Maestro Allergen"
- tapOn:
    id: "add-custom-allergen-button"

# Dismiss keyboard before publishing
- hideKeyboard

# Scroll to publish button and submit
- scrollUntilVisible:
    element:
      id: "publish-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "publish-button"
- waitForAnimationToEnd

# Verify we land on the inventory screen after successful publish
- extendedWaitUntil:
    visible:
      id: "inventory-screen"
    timeout: 10000
- assertVisible:
    id: "inventory-title"
- assertVisible:
    id: "new-listing-button"
