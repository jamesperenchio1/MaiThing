appId: com.jamyangperenchio.maithing
---
# Merchant analytics drill-down flow
- runFlow: merchant-switch-flow.yaml

# Tap the View Analytics quick action to open analytics
- tapOn:
    id: "view-analytics-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "merchant-analytics-screen"
    timeout: 10000
- assertVisible:
    text: "This Week"

# Return to dashboard
- tapOn:
    id: "header-back-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "merchant-dashboard-screen"
    timeout: 10000
- assertVisible:
    id: "merchant-dashboard-title"
