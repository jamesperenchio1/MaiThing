appId: com.jamyangperenchio.maithing
---
# Customer onboarding: open app, continue as test customer, verify home loads
- launchApp:
    clearState: true

- waitForAnimationToEnd
# Handle notification permission dialog
- runFlow:
    when:
      visible: "Would Like to Send You Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd
# Dismiss any lingering system dialog (e.g. deep-link confirmation)
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
      - waitForAnimationToEnd

- assertVisible:
    id: "welcome-screen"
- assertVisible:
    id: "welcome-title"
- scrollUntilVisible:
    element:
      id: "test-customer-button"
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: "test-customer-button"
    timeout: 10000

- tapOn:
    id: "test-customer-button"

- waitForAnimationToEnd
# Dismiss the first-time customer tutorial overlay if it appears
- runFlow:
    when:
      visible: "Welcome to Maithing!"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
# Complete/skip the personality onboarding if it appears
- runFlow:
    when:
      visible: "What do you love to eat?"
    commands:
      - tapOn: "Show me everything"
      - waitForAnimationToEnd
# Dismiss the first-time customer tutorial overlay if it appears after onboarding
- runFlow:
    when:
      visible: "Welcome to Maithing!"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "customer-home-screen"
    timeout: 10000

# Verify customer home loads
- assertVisible:
    text: "Good .*"
- assertVisible:
    text: "TEST Customer"
# Verify core home content sections are present
- assertVisible:
    text: "Categories"
- scroll
- waitForAnimationToEnd
# After scrolling, at least one content section should be visible
- assertVisible:
    text: "Craving right now"
