appId: com.jamyangperenchio.maithing
---
# Open a listing detail via deep link
- runFlow: customer-welcome-flow.yaml

# Deep-link directly to a known listing in the seed data
- openLink: "maithing:///(customer)/listing/listing-merchant-1-0-box"
- waitForAnimationToEnd
# Dismiss the "Open in maithing?" system dialog if it appears
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "listing-detail-screen"
    timeout: 10000

- assertVisible:
    id: "listing-description-section"
- assertVisible:
    id: "buy-now-button"

# Go back to home via swipe
- swipe:
    direction: RIGHT
    duration: 300
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "customer-home-screen"
    timeout: 10000
# Scroll back to top to verify the hero
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    id: "home-hero-title"
