name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Format · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dead-code / dep check
        run: pnpm knip

      - name: Test (shared)
        run: pnpm --filter @maithing/shared test -- --passWithNoTests

      - name: Build shared
        run: pnpm --filter @maithing/shared build

      - name: Build admin
        run: pnpm --filter @maithing/admin build

      - name: Build consumer web
        run: pnpm --filter @maithing/consumer build:web
